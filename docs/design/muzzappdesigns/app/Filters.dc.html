<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App — Filters</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4A0E1F}a:hover{color:#330915}
.app *{box-sizing:border-box}
.app h1,.app h2,.app h3{font-family:Lora,Georgia,serif;margin:0;letter-spacing:-0.02em}
.sec{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-bottom:1px solid #EADFD6}
.lbl{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.lbl span:last-child{color:#7E5F26}
.track{position:relative;height:6px;border-radius:9999px;background:#EADFD6;margin:10px 4px}
.fill{position:absolute;top:0;height:6px;border-radius:9999px;background:#4A0E1F}
.thumb{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:9999px;background:#FFFFFF;border:2px solid #4A0E1F;box-shadow:0 4px 10px -4px rgba(51,9,21,.5)}
.opt{border-radius:9999px;padding:9px 14px;font-size:14px;font-weight:600;border:1.5px solid #EADFD6;background:#FFFFFF;color:#4E3A3F;text-decoration:none}
.opt.on{background:#4A0E1F;border-color:#4A0E1F;color:#FAF6F1}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:9999px;font-weight:600;text-decoration:none;min-height:54px;padding:0 20px;font-size:16px;border:2px solid transparent;transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.pill:active{transform:scale(.97)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet{animation:sheetUp .5s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; overflow: hidden; background: rgba(51,9,21,.55); font-family: Inter, sans-serif; color: #2A0B13; display: flex; flex-direction: column; justify-content: flex-end;">
<div class="sheet" style="background: #FAF6F1; border-radius: 30px 30px 0 0; height: 780px; display: flex; flex-direction: column;">
<div style="display: flex; justify-content: center; padding: 10px 0 0;"><span style="width: 44px; height: 5px; border-radius: 9999px; background: #D9C7C1;"></span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 4px;">
<a href="#close" aria-label="Close" style="width: 40px; height: 40px; border-radius: 9999px; background: #FFFFFF; border: 1px solid #EADFD6; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A0E1F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="font-size: 22px; font-weight: 600; color: #4A0E1F;">Filters</h1>
<a href="#clear" style="font-size: 14px; font-weight: 600;">Clear all</a>
</div>
<div style="flex: 1 1 auto; overflow: hidden; padding: 0 20px;">
<div class="sec"><div class="lbl"><span>Age</span><span>22 – 30</span></div><div class="track"><div class="fill" style="left: 15%; right: 50%;"></div><span class="thumb" style="left: 15%;"></span><span class="thumb" style="left: 50%;"></span></div></div>
<div class="sec"><div class="lbl"><span>Height</span><span>5′ 0″ – 5′ 8″</span></div><div class="track"><div class="fill" style="left: 25%; right: 30%;"></div><span class="thumb" style="left: 25%;"></span><span class="thumb" style="left: 70%;"></span></div></div>
<div class="sec"><div class="lbl"><span>City</span><span>2 selected</span></div><div style="display: flex; gap: 8px; flex-wrap: wrap;"><a class="opt on" href="#c1">Hyderabad</a><a class="opt on" href="#c2">Secunderabad</a><a class="opt" href="#c3">Bengaluru</a><a class="opt" href="#c4">Abroad</a><a class="opt" href="#c5">+ More</a></div></div>
<div class="sec"><div class="lbl"><span>Marital status</span><span>Any</span></div><div style="display: flex; gap: 8px; flex-wrap: wrap;"><a class="opt" href="#m1">Never married</a><a class="opt" href="#m2">Divorced</a><a class="opt" href="#m3">Widowed</a></div></div>
<div class="sec" style="border-bottom: 0;"><div class="lbl"><span>Maslak</span><span>Any</span></div><div style="display: flex; gap: 8px; flex-wrap: wrap;"><a class="opt" href="#s1">Sunni</a><a class="opt" href="#s2">Shia</a><a class="opt" href="#s3">Other</a></div></div>
</div>
<div style="padding: 12px 20px 34px; border-top: 1px solid #EADFD6; background: #FFFFFF;"><a class="pill" href="#apply" style="background: #4A0E1F; color: #FAF6F1;">Show 38 profiles</a></div>
</div>
</div>
